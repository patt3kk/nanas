<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin Login — Nana’s Akara</title>
    <meta name="theme-color" content="#0F766E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Poppins:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <div class="page">
      <main class="section" style="min-height:100vh; display:flex; align-items:center;">
        <div class="container" style="max-width:520px;">
          <div class="card">
            <div class="card-body" style="display:grid; gap:14px;">
              <div>
                <div class="eyebrow">
                  <i class="fa-solid fa-lock" aria-hidden="true"></i>
                  Admin access
                </div>
                <h1 style="margin-top:10px; font-size:34px;">Admin Login</h1>
                <p class="muted" style="margin-top:8px;">
                  Use your admin credentials to manage orders and menu items.
                </p>
              </div>

              <form data-admin-login-form style="display:grid; gap:12px;">
                <div class="field">
                  <label class="label" for="adminEmail">Email</label>
                  <input class="input" id="adminEmail" name="email" type="email" autocomplete="email" required />
                </div>
                <div class="field">
                  <label class="label" for="adminPassword">Password</label>
                  <input class="input" id="adminPassword" name="password" type="password" autocomplete="current-password" required />
                </div>
                <button class="btn btn-primary" type="submit" data-admin-login-btn>Sign In</button>
                <div class="muted" style="font-size:13px;" data-admin-login-error></div>
              </form>

              <div style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;">
                <a class="btn btn-secondary btn-sm" href="../index.html">Back to Website</a>
                <a class="btn btn-secondary btn-sm" href="dashboard.html" data-admin-continue hidden>Continue</a>
              </div>
            </div>
          </div>
          <div class="toast" data-toast role="status" aria-live="polite"></div>
        </div>
      </main>
    </div>

    <script src="../js/runtime-config.js"></script>
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="js/login.js"></script>
  </body>
</html>
